<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/tile_pro_web/">

  <meta charset="UTF-8">
  <!-- Shared by both web hosts; framing is additionally blocked at bootstrap. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval' blob: https://www.gstatic.com https://accounts.google.com https://appleid.cdn-apple.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://appleid.apple.com https://appleid.cdn-apple.com https://europe-west3-tilepro-d7dfa.cloudfunctions.net; frame-src https://accounts.google.com https://appleid.apple.com; worker-src 'self' blob:; manifest-src 'self'; form-action 'self' https://appleid.apple.com">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tile project management and XML backup workspace.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TilePro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TilePro</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Sign in with Apple im Browser laeuft ueber Apples JS-SDK (Popup-Flow des
    Frameworks). Ohne dieses Script bleibt der Apple-Login im Web ohne
    Funktion; Service-ID und Return-URL kommen aus den Runtime-Defines.
  -->
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
